<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Budget Planner</title>
<!--
  Budget Planner: a private, single-file budgeting page. No network, no dependencies.
  Data lives only in this browser (localStorage key "budget-planner-v1"). Use Export to back up.

  JSON schema (version 1), used by Export and Import:
  {
    "version": 1,
    "currency": "ISK",
    "categories": [
      { "id": "income",   "name": "Income",              "lines": [ { "name": "Paycheck", "amount": 440000, "note": "optional text" } ] },
      { "id": "bills",    "name": "Bills",               "lines": [] },
      { "id": "debt",     "name": "Debt",                "lines": [] },
      { "id": "subs",     "name": "Subscriptions",       "lines": [] },
      { "id": "savings",  "name": "Savings & investing", "lines": [] },
      { "id": "everyday", "name": "Everyday spending",   "lines": [] }
    ]
  }
  - category ids must be one of the six above, no duplicates; missing categories are treated as empty.
  - "name" is a string, "amount" is a finite number in kr (negative allowed), "note" is optional.
  - Left over = income total - (bills + debt + subs + savings + everyday).
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: radial-gradient(60% 50% at 15% 10%, #ffffff 0%, rgba(255,255,255,0) 70%), radial-gradient(55% 45% at 90% 30%, #b9b9bc 0%, rgba(185,185,188,0) 70%), radial-gradient(60% 50% at 40% 100%, #a8a8ab 0%, rgba(168,168,171,0) 70%), #dcdcde;
    --text: #0b0b0c;
    --text2: rgba(0,0,0,0.62);
    --text3: rgba(0,0,0,0.44);
    --glass: rgba(255,255,255,0.55);
    --glass-strong: rgba(255,255,255,0.8);
    --border: rgba(255,255,255,0.85);
    --hair: rgba(0,0,0,0.10);
    --track: rgba(0,0,0,0.10);
    --fill: #111111;
    --red: #c4251c;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --s0: #111111; --s1: #3f3f3f; --s2: #6e6e6e; --s3: #9d9d9d; --s4: #c6c6c6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: radial-gradient(60% 50% at 15% 10%, #3b3b3d 0%, rgba(59,59,61,0) 70%), radial-gradient(55% 45% at 90% 30%, #2a2a2c 0%, rgba(42,42,44,0) 70%), radial-gradient(60% 50% at 40% 100%, #343436 0%, rgba(52,52,54,0) 70%), #0a0a0a;
      --text: #f5f5f5;
      --text2: rgba(255,255,255,0.62);
      --text3: rgba(255,255,255,0.42);
      --glass: rgba(255,255,255,0.07);
      --glass-strong: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.16);
      --hair: rgba(255,255,255,0.10);
      --track: rgba(255,255,255,0.12);
      --fill: #f5f5f5;
      --red: #ff6b63;
      --shadow: 0 8px 32px rgba(0,0,0,0.35);
      --s0: #ffffff; --s1: #d0d0d0; --s2: #a0a0a0; --s3: #707070; --s4: #4a4a4a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: clamp(16px, 4vw, 40px);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .glass {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 24px;
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    box-shadow: var(--shadow);
    padding: 20px;
    min-width: 0;
  }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .title { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
  .sub { font-size: 14px; color: var(--text2); padding-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, input { font-family: inherit; color: var(--text); }
  .pill {
    font-size: 14px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 9999px;
    padding: 8px 16px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .pill:hover { border-color: var(--text2); }
  .pill:focus-visible, .ghost:focus-visible, .x:focus-visible { outline: 2px solid var(--text2); outline-offset: 2px; }
  .label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text2); font-weight: 500; }
  .hero { padding: 24px; }
  .big { font-size: clamp(40px, 10vw, 72px); line-height: 1.05; font-weight: 300; letter-spacing: -0.03em; padding: 8px 0 20px; overflow-wrap: anywhere; }
  .over .big, .over .warn { color: var(--red); }
  .stats { display: flex; flex-wrap: wrap; gap: 24px; padding-bottom: 20px; }
  .stat { flex: 1 1 140px; min-width: 0; }
  .stat .v { font-size: 22px; font-weight: 500; padding-top: 4px; overflow-wrap: anywhere; }
  .bar { height: 10px; border-radius: 9999px; background: var(--track); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 9999px; background: var(--fill); width: 0; }
  .over .bar > div { background: var(--red); }
  .note { font-size: 13px; color: var(--text2); padding-top: 8px; }
  .warn { display: none; font-size: 14px; font-weight: 500; padding-top: 12px; }
  .over .warn { display: block; }
  .stack { display: flex; gap: 2px; height: 14px; border-radius: 9999px; overflow: hidden; background: var(--track); }
  .stack > div { min-width: 0; }
  .legend { padding-top: 12px; }
  .lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
  .lname { display: flex; align-items: center; gap: 10px; flex: 1 1 160px; min-width: 0; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 9999px; flex: none; }
  .lvals { display: flex; gap: 12px; margin-left: auto; font-size: 15px; }
  .lvals .p { color: var(--text2); }
  .lvals .a { font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
  .chead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding-bottom: 12px; }
  .cname { font-size: 18px; font-weight: 500; }
  .csum { text-align: right; }
  .csum .a { font-size: 18px; font-weight: 500; }
  .csum .p { font-size: 12px; color: var(--text2); }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 0; border-top: 1px solid var(--hair); }
  .lname-col { flex: 1 1 130px; min-width: 0; }
  .nm { width: 100%; font-size: 15px; background: transparent; border: none; outline: none; padding: 4px 0; }
  .nm::placeholder { color: var(--text3); }
  .lnote { font-size: 12px; color: var(--text3); }
  .amt { flex: 0 1 140px; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--hair); }
  .amt:focus-within { background: var(--glass-strong); border-color: var(--text2); }
  .amt input { width: 100%; min-width: 0; font-size: 15px; text-align: right; background: transparent; border: none; outline: none; padding: 0; }
  .amt span { font-size: 13px; color: var(--text2); }
  .x { font-size: 18px; line-height: 1; color: var(--text3); background: transparent; border: none; cursor: pointer; padding: 4px 6px; }
  .x:hover { color: var(--text); }
  .addrow { padding-top: 8px; border-top: 1px solid var(--hair); }
  .ghost { font-size: 14px; color: var(--text2); background: transparent; border: none; cursor: pointer; padding: 6px 0; }
  .ghost:hover { color: var(--text); }
  .foot { font-size: 13px; color: var(--text2); text-align: center; padding: 8px 0 16px; }
  #status { color: var(--text3); }
  #status.bad { color: var(--red); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">Budget Planner</div>
      <div class="sub">Monthly, in kr. Type a number and everything updates.</div>
    </div>
    <div class="actions">
      <button class="pill" id="export" type="button">Export</button>
      <button class="pill" id="import" type="button">Import</button>
      <button class="pill" id="clear" type="button">Clear all</button>
      <input type="file" id="file" accept="application/json,.json">
    </div>
  </div>

  <div class="glass hero" id="hero">
    <div class="label">Left over this month</div>
    <div class="big" id="left">0 kr</div>
    <div class="stats">
      <div class="stat"><div class="label">Income</div><div class="v" id="income">0 kr</div></div>
      <div class="stat"><div class="label">Spent</div><div class="v" id="spent">0 kr</div></div>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="note" id="progressNote">No income entered</div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="glass">
    <div class="label" style="padding-bottom:16px">Where the money goes</div>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="foot">
    Saved automatically in this browser only. Use Export to keep a backup file and Import to load one. <span id="status"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "budget-planner-v1";
  var CATS = [
    { id: "income", name: "Income" },
    { id: "bills", name: "Bills" },
    { id: "debt", name: "Debt" },
    { id: "subs", name: "Subscriptions" },
    { id: "savings", name: "Savings & investing" },
    { id: "everyday", name: "Everyday spending" }
  ];
  var OUT = ["bills", "debt", "subs", "savings", "everyday"];

  // state: { income: [{name, amount (string while editing), note?}], ... }
  var state = emptyState();

  function emptyState() {
    var s = {};
    CATS.forEach(function (c) { s[c.id] = []; });
    return s;
  }
  function num(s) {
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  function grouped(n) {
    var r = Math.round(n);
    return (r < 0 ? "-" : "") + Math.abs(r).toLocaleString("en-US");
  }
  function fmt(n) { return grouped(n) + " kr"; }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- schema ----------
  function toSchema() {
    return {
      version: 1,
      currency: "ISK",
      categories: CATS.map(function (c) {
        return {
          id: c.id,
          name: c.name,
          lines: state[c.id].map(function (l) {
            var o = { name: l.name, amount: num(l.amount) };
            if (l.note) o.note = l.note;
            return o;
          })
        };
      })
    };
  }
  // Returns { state } or { error }
  function parseSchema(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return { error: "File is not a budget object." };
    if (obj.version !== 1) return { error: "Unsupported or missing version (expected 1)." };
    if (typeof obj.currency !== "string") return { error: "Missing currency." };
    if (!Array.isArray(obj.categories)) return { error: "Missing categories list." };
    var valid = {};
    CATS.forEach(function (c) { valid[c.id] = true; });
    var out = emptyState();
    var seen = {};
    for (var i = 0; i < obj.categories.length; i++) {
      var c = obj.categories[i];
      if (!c || typeof c !== "object") return { error: "Category " + (i + 1) + " is invalid." };
      if (!valid[c.id]) return { error: "Unknown category id: " + String(c.id) };
      if (seen[c.id]) return { error: "Duplicate category id: " + c.id };
      seen[c.id] = true;
      if (!Array.isArray(c.lines)) return { error: "Category " + c.id + " has no lines list." };
      for (var j = 0; j < c.lines.length; j++) {
        var l = c.lines[j];
        if (!l || typeof l !== "object") return { error: "A line in " + c.id + " is invalid." };
        if (typeof l.name !== "string") return { error: "A line in " + c.id + " has no name." };
        if (typeof l.amount !== "number" || !isFinite(l.amount)) return { error: 'Line "' + l.name + '" in ' + c.id + " has no valid amount." };
        if (l.note !== undefined && typeof l.note !== "string") return { error: 'Line "' + l.name + '" has an invalid note.' };
        var line = { name: l.name, amount: String(l.amount) };
        if (l.note) line.note = l.note;
        out[c.id].push(line);
      }
    }
    return { state: out };
  }

  // ---------- storage ----------
  function setStatus(msg, bad) {
    var s = $("status");
    s.textContent = msg || "";
    s.className = bad ? "bad" : "";
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSchema()));
      setStatus("");
    } catch (e) {
      setStatus("Couldn't save in this browser. Use Export to keep your data.", true);
    }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var res = parseSchema(JSON.parse(raw));
      if (res.state) state = res.state;
    } catch (e) { /* ignore corrupt or unavailable storage */ }
  }

  // ---------- totals ----------
  function sum(k) {
    return state[k].reduce(function (a, l) { return a + num(l.amount); }, 0);
  }
  var subtotalEls = {};
  var legendEls = [];

  function updateTotals() {
    var income = sum("income");
    var totals = OUT.map(function (k) { return { key: k, total: sum(k) }; });
    var out = totals.reduce(function (a, t) { return a + t.total; }, 0);
    var left = income - out;
    var over = left < 0;
    function pct(v) { return income > 0 ? Math.round(v / income * 100) + "%" : "–"; }

    $("hero").classList.toggle("over", over);
    $("left").textContent = fmt(left);
    $("income").textContent = fmt(income);
    $("spent").textContent = fmt(out);
    var spentPct = income > 0 ? Math.min(100, out / income * 100) : (out > 0 ? 100 : 0);
    $("progress").style.width = spentPct + "%";
    $("progressNote").textContent = income > 0 ? Math.round(out / income * 100) + "% of income spent" : "No income entered";
    $("warn").textContent = over ? "Over budget: spending is " + fmt(-left) + " more than income." : "";

    var den = Math.max(income, out, 1);
    var stack = $("stack");
    stack.textContent = "";
    totals.forEach(function (t, i) {
      if (t.total > 0) {
        var seg = el("div");
        seg.style.width = (t.total / den * 100) + "%";
        seg.style.background = "var(--s" + i + ")";
        stack.appendChild(seg);
      }
    });
    totals.forEach(function (t, i) {
      legendEls[i].p.textContent = pct(t.total);
      legendEls[i].a.textContent = fmt(t.total);
    });

    CATS.forEach(function (c) {
      var s = subtotalEls[c.id];
      s.a.textContent = fmt(sum(c.id));
      if (s.p) s.p.textContent = pct(sum(c.id)) + " of income";
    });
  }

  // ---------- rendering ----------
  function buildLegend() {
    var legend = $("legend");
    legend.textContent = "";
    legendEls = [];
    OUT.forEach(function (k, i) {
      var cat = CATS.filter(function (c) { return c.id === k; })[0];
      var row = el("div", "lrow");
      var name = el("div", "lname");
      var dot = el("div", "dot");
      dot.style.background = "var(--s" + i + ")";
      name.appendChild(dot);
      name.appendChild(el("div", null, cat.name));
      var vals = el("div", "lvals");
      var p = el("div", "p", "–");
      var a = el("div", "a", "0 kr");
      vals.appendChild(p);
      vals.appendChild(a);
      row.appendChild(name);
      row.appendChild(vals);
      legend.appendChild(row);
      legendEls.push({ p: p, a: a });
    });
  }

  function lineRow(k, line) {
    var row = el("div", "line");

    var nameCol = el("div", "lname-col");
    var nm = el("input", "nm");
    nm.type = "text";
    nm.placeholder = "Name";
    nm.value = line.name;
    nm.setAttribute("aria-label", "Line name");
    nm.addEventListener("input", function () { line.name = nm.value; save(); });
    nameCol.appendChild(nm);
    if (line.note) nameCol.appendChild(el("div", "lnote", line.note));

    var amt = el("div", "amt");
    var inp = el("input");
    inp.type = "text";
    inp.setAttribute("inputmode", "decimal");
    inp.setAttribute("aria-label", "Amount in kr");
    inp.placeholder = "0";
    inp.value = grouped(num(line.amount));
    inp.addEventListener("focus", function () {
      inp.value = line.amount === "0" || line.amount === "" ? "" : line.amount;
      inp.select();
    });
    inp.addEventListener("blur", function () {
      if (line.amount === "") line.amount = "0";
      inp.value = grouped(num(line.amount));
    });
    inp.addEventListener("input", function () {
      var clean = inp.value.replace(/[^0-9.\-]/g, "");
      if (clean !== inp.value) inp.value = clean;
      line.amount = clean;
      updateTotals();
      save();
    });
    amt.appendChild(inp);
    amt.appendChild(el("span", null, "kr"));

    var x = el("button", "x", "×");
    x.type = "button";
    x.setAttribute("aria-label", "Remove line");
    x.addEventListener("click", function () {
      var i = state[k].indexOf(line);
      if (i >= 0) state[k].splice(i, 1);
      renderCards();
      updateTotals();
      save();
    });

    row.appendChild(nameCol);
    row.appendChild(amt);
    row.appendChild(x);
    return row;
  }

  function renderCards() {
    var cards = $("cards");
    cards.textContent = "";
    subtotalEls = {};
    CATS.forEach(function (c) {
      var card = el("div", "glass");
      var head = el("div", "chead");
      head.appendChild(el("div", "cname", c.name));
      var sumBox = el("div", "csum");
      var a = el("div", "a", "0 kr");
      sumBox.appendChild(a);
      var p = null;
      if (c.id !== "income") {
        p = el("div", "p", "– of income");
        sumBox.appendChild(p);
      }
      head.appendChild(sumBox);
      card.appendChild(head);
      subtotalEls[c.id] = { a: a, p: p };

      state[c.id].forEach(function (line) { card.appendChild(lineRow(c.id, line)); });

      var addRow = el("div", "addrow");
      var add = el("button", "ghost", "+ Add line");
      add.type = "button";
      add.addEventListener("click", function () {
        var line = { name: "", amount: "0" };
        state[c.id].push(line);
        renderCards();
        updateTotals();
        save();
        var cardEl = $("cards").children[CATS.indexOf(c)];
        var inputs = cardEl.querySelectorAll(".nm");
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
      addRow.appendChild(add);
      card.appendChild(addRow);
      cards.appendChild(card);
    });
  }

  function renderAll() {
    renderCards();
    updateTotals();
  }

  // ---------- export / import / clear ----------
  function todayStamp() {
    var d = new Date();
    function z(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function doExport() {
    var blob = new Blob([JSON.stringify(toSchema(), null, 2) + "\n"], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "budget-" + todayStamp() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function importText(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { alert("Import failed: that file isn't valid JSON."); return false; }
    var res = parseSchema(obj);
    if (res.error) { alert("Import failed: " + res.error); return false; }
    if (!confirm("Replace everything currently in the planner with the imported file? This can't be undone (export first if unsure).")) return false;
    state = res.state;
    renderAll();
    save();
    return true;
  }
  function doClear() {
    if (!confirm("Clear all lines and amounts? This can't be undone (export first if unsure).")) return;
    state = emptyState();
    renderAll();
    save();
  }

  $("export").addEventListener("click", doExport);
  $("import").addEventListener("click", function () { $("file").click(); });
  $("clear").addEventListener("click", doClear);
  $("file").addEventListener("change", function () {
    var f = $("file").files && $("file").files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result)); $("file").value = ""; };
    reader.onerror = function () { alert("Import failed: couldn't read the file."); $("file").value = ""; };
    reader.readAsText(f);
  });

  buildLegend();
  load();
  renderAll();
})();
</script>
</body>
</html>
